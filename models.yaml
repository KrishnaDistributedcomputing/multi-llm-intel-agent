models:
  - id: local-qwen3
    label: Qwen3 4B / Intel CPU
    kind: local
    model: ollama_chat/qwen3:4b
    enabled: true

  # Set enabled: true only for routes you intend to use.
  # Cloud routes also require ALLOW_CLOUD=true and compose.cloud.yaml.
  - id: openai
    label: OpenAI
    kind: cloud
    model: openai/gpt-4o-mini
    key_env: OPENAI_API_KEY
    enabled: false
  - id: anthropic
    label: Anthropic
    kind: cloud
    model: anthropic/claude-sonnet-4-20250514
    key_env: ANTHROPIC_API_KEY
    enabled: false
  - id: gemini
    label: Gemini
    kind: cloud
    model: gemini/gemini-2.5-flash
    key_env: GEMINI_API_KEY
    enabled: false
  - id: azure
    label: Azure OpenAI
    kind: cloud
    model: azure/REPLACE_WITH_DEPLOYMENT
    api_base: https://REPLACE_WITH_RESOURCE.openai.azure.com
    api_version: "2024-10-21"
    key_env: AZURE_API_KEY
    enabled: false
  - id: compatible
    label: OpenAI-compatible endpoint
    kind: cloud
    model: openai/REPLACE_WITH_MODEL
    api_base: https://REPLACE_WITH_ENDPOINT/v1
    key_env: COMPATIBLE_API_KEY
    enabled: false

  # Development candidates, not approved for federal nonpublic information.
  # Set each full downloaded digest after reviewing its source and license.
