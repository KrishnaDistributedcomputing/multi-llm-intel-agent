[project]
name = "intel-local-agent"
version = "0.1.0"
description = "Local-first, allowlisted multi-LLM agent for an Intel PC"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.7,<3",
    "pyyaml>=6,<7",
    "temporalio>=1.20,<2",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "ipykernel",
    "ipywidgets",
    "mypy",
    "pytest",
    "ruff",
    "tqdm",
    "types-pyyaml",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["agent", "gateway"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
