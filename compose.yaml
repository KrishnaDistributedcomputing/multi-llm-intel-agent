name: intel-agent

services:
  ollama:
    image: ${ACR_LOGIN_SERVER:-intel-agent-local}/ollama:${IMAGE_TAG:-0.1.0}
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "1"
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ollama-models:/root/.ollama
    networks: [private]
    restart: unless-stopped
    mem_limit: 8g
    cpus: 4
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  gateway:
    image: ${ACR_LOGIN_SERVER:-intel-agent-local}/gateway:${IMAGE_TAG:-0.1.0}
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.gateway
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY}
      LOCAL_MODEL_DIGEST: ${LOCAL_MODEL_DIGEST:-}
      ALLOW_CLOUD: ${ALLOW_CLOUD:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AZURE_API_KEY: ${AZURE_API_KEY:-}
      COMPATIBLE_API_KEY: ${COMPATIBLE_API_KEY:-}
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HOME: /tmp
    volumes:
      - ./models.yaml:/app/models.yaml:ro
    networks: [private]
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=1770"]
    mem_limit: 2g
    cpus: 2
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  agent:
    image: ${ACR_LOGIN_SERVER:-intel-agent-local}/agent:${IMAGE_TAG:-0.1.0}
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      AGENT_API_KEY: ${AGENT_API_KEY:?Set AGENT_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY}
      LOCAL_MODEL_DIGEST: ${LOCAL_MODEL_DIGEST:-}
      ALLOW_CLOUD: ${ALLOW_CLOUD:-false}
      CLOUD_DAILY_BUDGET_USD: ${CLOUD_DAILY_BUDGET_USD:-1}
      CLOUD_CALLS_PER_MINUTE: ${CLOUD_CALLS_PER_MINUTE:-6}
      CLOUD_VERIFY_INTERVAL_SECONDS: ${CLOUD_VERIFY_INTERVAL_SECONDS:-3600}
    volumes:
      - ./models.yaml:/app/models.yaml:ro
      - agent-usage:/app/data
    networks: [private]
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=1770"]
    mem_limit: 512m
    cpus: 1
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        - CMD
        - .venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3

  ingress:
    image: ${ACR_LOGIN_SERVER:-intel-agent-local}/agent:${IMAGE_TAG:-0.1.0}
    platform: linux/amd64
    command:
      - .venv/bin/uvicorn
      - agent.ingress:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --workers
      - "1"
      - --limit-concurrency
      - "16"
      - --timeout-keep-alive
      - "5"
      - --no-access-log
    ports:
      - "127.0.0.1:${AGENT_PORT:-8000}:8080"
    networks: [private, ingress]
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:uid=10001,gid=10001,mode=1770"]
    mem_limit: 128m
    cpus: 1
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        - CMD
        - .venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ollama-models:
  agent-usage:

networks:
  private:
    internal: true
  ingress: {}
